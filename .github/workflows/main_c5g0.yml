name: C5GO CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Individual_project_Vladimir_Stijepovic.sln

      - name: Verify formatting and analyzers
        run: dotnet format Individual_project_Vladimir_Stijepovic.sln --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build Individual_project_Vladimir_Stijepovic.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Unit_Tests/Unit_Tests.csproj --configuration Release --no-build --no-restore

      - name: Verify website publish
        run: dotnet publish Website/Website.csproj --configuration Release --no-build --no-restore --output "${{ runner.temp }}/website"

  docker:
    runs-on: ubuntu-latest
    env:
      C5GO_HTTP_PORT: 5063
      MYSQL_DATABASE: c5go_ci
      MYSQL_USER: c5go_ci
      MYSQL_PASSWORD: ci-app-password-2026
      MYSQL_ROOT_PASSWORD: ci-root-password-2026
      APP_BASE_URL: http://localhost:5063
      APP_AUTH_URL: http://localhost:5063
      APP_API_URL: http://localhost:5063
      EMAIL_SENDER_EMAIL: ci@example.com
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-email-password
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      COMMUNITY_ENABLED: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

      - name: Start Docker environment
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify website health
        run: curl --fail --silent --show-error http://127.0.0.1:5063/health

      - name: Verify website and initialized database
        run: |
          curl --fail --silent --show-error http://127.0.0.1:5063/ > /dev/null
          docker compose exec --no-TTY database mysql \
            --user="$MYSQL_USER" \
            --password="$MYSQL_PASSWORD" \
            "$MYSQL_DATABASE" \
            --execute="SELECT COUNT(*) AS platform_role_count FROM platform_role;"

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker environment
        if: always()
        run: docker compose down --volumes --remove-orphans

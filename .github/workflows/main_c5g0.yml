# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - c5g0

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Individual_project_Vladimir_Stijepovic.sln

      - name: Build
        run: dotnet build Individual_project_Vladimir_Stijepovic.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Unit_Tests/Unit_Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish website
        run: dotnet publish Website/Website.csproj --configuration Release --no-restore --output "${{ runner.temp }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9C4AA3706254A1CADA883B701004994 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1356AB58D13347B38E1B80438A59E99A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1E52375F3A9E476586C82A68D8683A1E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'c5g0'
          slot-name: 'Production'
          package: ./publish
